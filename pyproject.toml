[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisbet"
version = "0.0.1"
description = "Modular ATP match outcome + closeness prediction and value-betting engine"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]   # core stays tiny on purpose

# Each module declares its own deps so it can be installed/iterated independently.
[project.optional-dependencies]
data   = ["pandas>=2.0", "pyarrow>=14", "requests>=2.31"]
models = ["numpy>=1.26", "scikit-learn>=1.3", "lightgbm>=4.0"]
news   = ["feedparser>=6.0", "beautifulsoup4>=4.12"]
dev    = ["pytest>=7.4"]

[project.scripts]
tennisbet = "tennisbet.cli:main"

[tool.setuptools.packages.find]
include = ["tennisbet*"]
